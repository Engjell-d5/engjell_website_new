services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: engjell-website-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engjell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-engjell_website}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL port mapping (exposed for migration script access from host)
    # Using 5434 to avoid conflict with other PostgreSQL containers
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engjell}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - engjell-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass NEXT_PUBLIC_* variables as build arguments
        # These must be available at build time for Next.js
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: engjell-website-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-engjell}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-engjell_website}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      # Social Media OAuth Credentials
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      # Site URL
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      # Optional: Pre-configured Threads User Access Token
      THREADS_USER_ACCESS_TOKEN: ${THREADS_USER_ACCESS_TOKEN:-}
      # YouTube API
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Sender (Newsletter) API Credentials
      SENDER_API_KEY: ${SENDER_API_KEY:-}
      SENDER_LIST_ID: ${SENDER_LIST_ID:-}
      SENDER_REPLY_TO: ${SENDER_REPLY_TO:-}
      SENDER_FROM_NAME: ${SENDER_FROM_NAME:-}
      # Google Email OAuth Credentials
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Push Notifications (VAPID)
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Cron Job Security
      CRON_SECRET: ${CRON_SECRET:-}
      # External API (for email tasks)
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      PUBLIC_API_BOARD_ID: ${PUBLIC_API_BOARD_ID:-}
      # Analytics (optional)
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    ports:
      - "${APP_PORT:-7776}:3000"
    volumes:
      # Persist uploads directory
      - ./public/uploads:/app/public/uploads
      # Persist data directory (for migrations, etc.)
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - engjell-network
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["node", "server.js"]

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: engjell-website-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - engjell-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  engjell-network:
    driver: bridge

